spring:
  application:
    name: demo

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:demodb
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false


app:
  jwt:
    secret: DemoapplicationSecretkeyforspringbootjwtgeneration
    expiry: 300000
    refresh-expiry: 86400000